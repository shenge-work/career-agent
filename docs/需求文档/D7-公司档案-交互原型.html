<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司档案 · 交互原型（设计稿）</title>
<style>
:root{
  --bg:#f0f0f0; --panel:#fff; --panel-2:#fafafa; --card:#fff; --text:#1a1a1a;
  --muted:#6b6b6b; --faint:#9a9a9a; --border:#d6d6d6; --border-soft:#e6e6e6;
  --solid:#222; --solid-text:#fff; --hover:#f1f1f1; --focus:#999;
}
[data-theme="dark"]{
  --bg:#161616; --panel:#1e1e1e; --panel-2:#242424; --card:#202020; --text:#ededed;
  --muted:#a8a8a8; --faint:#7d7d7d; --border:#3a3a3a; --border-soft:#303030;
  --solid:#ededed; --solid-text:#161616; --hover:#2b2b2b; --focus:#aaa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.6}
[hidden]{display:none!important}
button,input,textarea,select{font-family:inherit;font-size:13px;color:var(--text)}
button{cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px}
button:hover{background:var(--hover)}
button.solid{background:var(--solid);color:var(--solid-text);border-color:var(--solid)}
button.solid:hover{opacity:.85}
button.ghost{border-color:transparent}
input,textarea,select{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 9px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--focus);box-shadow:0 0 0 2px var(--border-soft)}
input[type="checkbox"]{width:auto;accent-color:var(--solid)}
a{color:var(--text);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.banner{background:var(--solid);color:var(--solid-text);font-size:12px;padding:6px 20px;text-align:center;letter-spacing:.3px}
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 0;margin-bottom:18px}
.topbar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}
.spacer{flex:1}
.search{max-width:260px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:6px;padding:2px 9px;font-size:12px;color:var(--muted);background:var(--panel)}
.chip.on{background:var(--solid);color:var(--solid-text);border-color:var(--solid)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px}
.stat .n{font-size:24px;font-weight:500;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.notice{font-size:12px;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:14px 15px;transition:transform .12s,border-color .12s;cursor:pointer}
.card:hover{transform:translateY(-2px);border-color:var(--border)}
.card .name{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.card .summary{font-size:12px;color:var(--muted);min-height:36px;margin-bottom:10px}
.bar{display:flex;gap:3px;margin-bottom:10px}
.bar i{height:6px;flex:1;border-radius:2px;border:1px solid var(--border);display:block}
.bar i.fill{background:var(--text);border-color:var(--text)}
.card .foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--border-soft);padding-top:9px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border-soft);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
th{background:var(--panel-2);color:var(--muted);font-weight:400}
tr:last-child td{border-bottom:none}
.empty{padding:36px 16px;text-align:center;color:var(--faint);border:1px dashed var(--border);border-radius:8px}

.detail-head{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.detail-head h2{font-size:20px;font-weight:500;margin:0 0 8px}
.detail-head .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.detail-head .summary{border-left:2px solid var(--border);padding-left:10px;color:var(--muted);font-size:13px}
.coverbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.coverbar .bar{flex:1;min-width:160px;margin:0}
.coverbar .bar i{height:8px}
.backbar{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.detail-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.toc{position:sticky;top:78px;background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:10px;font-size:12.5px}
.toc a{display:block;padding:6px 10px;border-radius:6px;color:var(--muted)}
.toc a:hover{background:var(--hover)}
.toc a.on{background:var(--panel-2);color:var(--text);font-weight:500;border-left:2px solid var(--text)}
.sec{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px;margin-bottom:14px;scroll-margin-top:86px}
.sec h3{font-size:14px;font-weight:500;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h3 .cnt{font-size:12px;color:var(--faint);font-weight:400}
.rcard{border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.rcard:last-child{margin-bottom:0}
.rcard .rh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--muted)}
.rcard .body{font-size:13px;white-space:pre-wrap}
.rcard .rf{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:12px}
.rcard textarea{margin:8px 0}
.jdcard{border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.jdcard .t{font-size:15px;font-weight:500}
.jdcard .s{font-size:14px;font-weight:500;margin-left:10px}
.jdcard .m{font-size:12px;color:var(--muted);margin:5px 0 9px}
.jdchips{display:flex;gap:5px;flex-wrap:wrap}
.jdcard .f{font-size:12px;color:var(--muted);margin-top:9px;border-top:1px solid var(--border-soft);padding-top:8px}
.rowline{display:flex;align-items:center;gap:10px;border:1px solid var(--border-soft);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;flex-wrap:wrap}
.readonly{font-size:12px;color:var(--faint);border:1px dashed var(--border);border-radius:6px;padding:5px 9px}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.drawer{width:min(480px,100%);height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:500;display:flex;align-items:center}
.drawer .db{flex:1;overflow:auto;padding:16px 18px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
details{border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;background:var(--panel)}
details>summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:500;list-style:none}
details>summary::before{content:"＋ ";font-weight:400}
details[open]>summary::before{content:"－ "}
details .dc{padding:0 12px 12px}
.ritem{border:1px solid var(--border-soft);border-radius:8px;padding:10px;margin-bottom:8px}
.ritem .rr{display:flex;gap:6px;margin-bottom:6px}
.ritem .rr select,.ritem .rr input{width:auto;flex:1}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column}
.mbox .mh{padding:14px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:500}
.mbox .mb{padding:16px 18px;overflow:auto}
.mbox .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
pre{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;line-height:1.7;margin:12px 0 0}
.opts{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}
.opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--solid);color:var(--solid-text);border-radius:8px;padding:9px 16px;font-size:12.5px}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th,.cmp td{border:1px solid var(--border-soft);padding:8px 10px;vertical-align:top}
.cmp th{background:var(--panel-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-grid{grid-template-columns:1fr}
  .toc{position:static;display:flex;flex-wrap:wrap;gap:4px}
  .toc a{display:inline-block}
}
/* ===== v2 新增：行业筛选 / 相册 / 结构化表 / 图 / 风闻 / 简报图片（全部灰阶 + 变量） ===== */
.indsel{width:auto;min-width:150px}
.matchhint{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px dashed var(--border);border-radius:6px;padding:3px 9px}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.album .ph{position:relative;aspect-ratio:4/3;border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--panel-2)}
.album .ph img{width:100%;height:100%;object-fit:cover;display:block}
.album .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:11px;background:var(--panel);color:var(--muted);border-top:1px solid var(--border-soft)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.lightbox img{max-width:min(880px,92vw);max-height:68vh;border:1px solid var(--border);border-radius:8px}
.lightbox .lbar{display:flex;align-items:center;gap:10px;color:#ededed;font-size:12.5px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:8px}
.lightbox button{color:#ededed;border-color:#888}
.btable{width:100%;border-collapse:collapse;font-size:12.5px}
.btable th,.btable td{border-bottom:1px solid var(--border-soft);padding:7px 9px;text-align:left;vertical-align:top}
.btable th{background:var(--panel-2);color:var(--muted);font-weight:400}
.diff{font-size:11px;border:1px dashed var(--border);border-radius:5px;padding:1px 6px;color:var(--muted)}
.chart{border:1px solid var(--border-soft);border-radius:8px;padding:12px;background:var(--panel-2);margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{fill:var(--muted);font-family:inherit}
.chart svg .lbl{fill:var(--text)}
.chart svg .axis{stroke:var(--border-soft)}
.chart svg .range{fill:var(--border-soft);stroke:var(--border)}
.chart svg .avg{stroke:var(--text)}
.chart svg .jd{fill:none;stroke:var(--muted)}
.chart svg .step{fill:none;stroke:var(--text)}
.chart svg .fill{fill:var(--border-soft)}
.chart svg .node{fill:var(--text)}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.metrics span{border:1px solid var(--border-soft);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--muted)}
.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.timeline .tn{border:1px solid var(--border-soft);border-radius:8px;padding:7px 10px;font-size:12px;background:var(--panel)}
.timeline .tn b{font-weight:500}
.phases{display:flex;margin-bottom:10px}
.phase{flex:1;border:1px solid var(--border);border-right:none;padding:9px 10px;background:var(--panel);font-size:12px;min-width:0}
.phase:first-child{border-radius:8px 0 0 8px}
.phase:last-child{border-right:1px solid var(--border);border-radius:0 8px 8px 0}
.phase.dashed{border-style:dashed;background:var(--panel-2)}
.phase .pt{font-weight:500;display:block;margin-bottom:3px}
.phase .pd{color:var(--muted);font-size:11.5px}
.lanes{width:100%;border-collapse:collapse;font-size:12px}
.lanes th,.lanes td{border:1px solid var(--border-soft);padding:7px 9px;text-align:left}
.lanes th{background:var(--panel-2);color:var(--muted);font-weight:400;width:90px}
.linkrow{display:flex;align-items:center;gap:9px;border:1px solid var(--border-soft);border-radius:8px;padding:9px 11px;margin-bottom:8px;flex-wrap:wrap}
.linkrow .lt{font-size:13px}
.linkrow .ls{font-size:12px;color:var(--muted);width:100%}
.rumor{border:1px dashed var(--border);background:var(--panel-2);border-radius:8px;padding:11px 13px;margin-bottom:9px}
.rumor .rt{font-size:11px;color:var(--faint);letter-spacing:.5px;margin-bottom:6px}
.rumor .rb{font-size:13px;white-space:pre-wrap}
.rumor .rm{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:9px;flex-wrap:wrap}
.vrow{display:flex;gap:10px;border-bottom:1px solid var(--border-soft);padding:8px 0;font-size:12.5px}
.vrow:last-child{border-bottom:none}
.vrow .vk{width:96px;color:var(--muted);flex:none}
.briefimg{margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--panel-2)}
.briefimg canvas{width:100%;display:block;background:#fff;border:1px solid var(--border-soft);border-radius:4px}
.cfmt{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .album{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phases{flex-direction:column}
  .phase{border-right:1px solid var(--border);border-bottom:none;border-radius:0}
  .phase:first-child{border-radius:8px 8px 0 0}
  .phase:last-child{border-bottom:1px solid var(--border);border-radius:0 0 8px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

var INDUSTRY_ALIASES = {
  '大模型':'ai','LLM':'ai','生成式AI':'ai','AIGC':'ai','智能体':'ai','Agent':'ai','人工智能':'ai','AI 应用':'ai',
  '芯片':'semi','IC':'semi','晶圆':'semi','MCU':'semi','车规':'semi','半导体':'semi','AR':'semi','XR':'semi','眼镜':'semi','空间计算':'semi','智能硬件':'semi',

  '电商':'net','游戏':'net','内容平台':'net'
};
function catName(id){ var t=INDUSTRY_TAXONOMY.filter(function(x){return x.id===id;})[0]; return t?t.name:'其他'; }
function inferIndustryCategory(text){
  var s=String(text||'').toLowerCase();
  var keys=Object.keys(INDUSTRY_ALIASES).sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<keys.length;i++){ if(s.indexOf(keys[i].toLowerCase())>=0) return INDUSTRY_ALIASES[keys[i]]; }
  return 'other';
}
function industryCatOf(c){ return c.industryCategory || inferIndustryCategory(c.industry); }
function expandIndustryQuery(q){
  var s=String(q||'').trim().toLowerCase();
  if(!s) return {cats:[],alias:''};
  var keys=Object.keys(INDUSTRY_ALIASES).sort(function(a,b){return b.length-a.length;});
  var cats=[], alias='';
  for(var i=0;i<keys.length;i++){
    if(s.indexOf(keys[i].toLowerCase())>=0){
      var cid=INDUSTRY_ALIASES[keys[i]];
      if(cats.indexOf(cid)<0) cats.push(cid);
      if(!alias) alias=keys[i];
    }
  }
  return {cats:cats,alias:alias};
}
function matchIndustry(c,exp){
  if(!exp.cats.length) return false;
  if(exp.cats.indexOf(industryCatOf(c))>=0) return true;
  return (c.industryAliases||[]).some(function(a){ return exp.alias && String(a).toLowerCase().indexOf(exp.alias.toLowerCase())>=0; });
}

  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

var state = { view:'list', id:null, mode:'card', q:'', filter:'all', industry:'all', sort:'updated', checked:{}, scroll:0, fromTracker:false, editingRid:null, drawerId:null, focusDim:'', matchHint:'', lbId:null, lbIdx:0 };

function coveredDims(c){
  return DIMS.filter(function(d){ return (c.research||[]).some(function(r){return r.dim===d;}); });
}
function coverage(c){ return coveredDims(c).length; }
function allText(c){
  var s=[c.name,c.industry,catName(industryCatOf(c)),c.location,c.scale,c.summary,(c.tags||[]).join(' '),(c.note||''),(c.industryAliases||[]).join(' ')];
  (c.research||[]).forEach(function(r){s.push(r.content,r.platform);});
  (c.jds||[]).forEach(function(j){s.push(j.title,(j.skills||[]).join(' '),(j.duties||[]).join(' '));});
  (c.links||[]).forEach(function(l){s.push(l.title,(l.tags||[]).join(' '));});
  (c.rumors||[]).forEach(function(u){s.push(u.content);});
  if(c.verdict) s.push(c.verdict.focus,c.verdict.redline);
  return s.join(' ').toLowerCase();
}
function filtered(){
  state.matchHint='';
  var exp=expandIndustryQuery(state.q);
  var arr=DATA.filter(function(c){
    if(state.q){
      var literal=allText(c).indexOf(state.q.toLowerCase())>=0;
      var byInd=matchIndustry(c,exp);
      if(!literal && !byInd) return false;
      if(!literal && byInd && !state.matchHint) state.matchHint='按行业匹配：'+catName(exp.cats[0])+' ← '+exp.alias;
    }
    if(state.industry!=='all' && industryCatOf(c)!==state.industry) return false;
    if(state.filter==='jd' && !(c.jds||[]).length) return false;
    if(state.filter==='missing' && coverage(c)===6) return false;
    if(state.filter==='recent' && c.updated<'10-28') return false;
    return true;
  });
  arr.sort(function(a,b){
    if(state.sort==='name') return a.name.localeCompare(b.name,'zh');
    if(state.sort==='research') return (b.research||[]).length-(a.research||[]).length;
    if(state.sort==='coverage') return coverage(b)-coverage(a);
    return (a.pinned===b.pinned)? (b.updated>a.updated?1:-1) : (a.pinned?-1:1);
  });
  return arr;
}
function opts(list,sel){ return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join(''); }
function toast(msg){

function bindApp(){
  if(state._bound) return;
  state._bound=true;
  var app=document.getElementById('app');
  app.addEventListener('click',appClick);
  app.addEventListener('change',appChange);
  document.getElementById('q').addEventListener('input',function(){ state.q=this.value.trim(); renderList(); });
}
function appChange(e){
  if(e.target.id==='sortSel'){ state.sort=e.target.value; renderList(); }
  if(e.target.id==='indSel'){ state.industry=e.target.value; renderList(); }
}
function appClick(e){
  var t=e.target;
  var anchor=t.closest('[data-anchor]');
  if(anchor && state.view==='detail'){
    e.preventDefault();
    var el=document.getElementById(anchor.getAttribute('data-anchor'));
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(state.view==='list'){
    if(t.getAttribute('data-act')==='check'){
      var cid=t.getAttribute('data-id'); state.checked[cid]=!state.checked[cid]; e.stopPropagation(); renderList(); return;
    }
    var chip=t.closest('[data-act="filter"]');
    if(chip){ state.filter=chip.getAttribute('data-v'); renderList(); return; }
    if(t.closest('[data-act="clearQ"]')){ state.q=''; document.getElementById('q').value=''; renderList(); return; }
    if(t.closest('[data-act="compare"]')){ openCompare(); return; }
    var row=t.closest('[data-id]');
    if(row){ state.scroll=window.scrollY; goDetail(row.getAttribute('data-id')); }
    return;
  }
  var btn=t.closest('[data-act]');
  if(!btn) return;
  var act=btn.getAttribute('data-act'), v=btn.getAttribute('data-v')||'';
  var c=byId(state.id);
  if(act==='back'){ goBack(); return; }
  if(act==='backToTracker'){ state.fromTracker=false; toast('原型：返回投递详情 #/tracker/'+(((c.deliveries||[])[0]||{}).id||'')); renderDetail(); return; }
  if(act==='edit'){ openDrawer(c.id); return; }
  if(act==='new'){ openDrawer(null); return; }
  if(act==='brief'){ openBrief(c); return; }
  if(act==='fillDim'){ openDrawer(c.id,v); return; }
  if(act==='editR'){ state.editingRid=v; renderDetail(); var et=document.getElementById('edText'); if(et) et.focus(); return; }
  if(act==='cancelR'){ state.editingRid=null; renderDetail(); return; }
  if(act==='saveR'){
    var r=(c.research||[]).filter(function(x){return x.id===v;})[0];
    if(r){ r.dim=document.getElementById('edDim').value; r.platform=document.getElementById('edPlat').value; r.date=document.getElementById('edDate').value; r.content=document.getElementById('edText').value; }
    state.editingRid=null; c.updated='11-03'; toast('已就地保存这一条调研'); renderDetail(); return;
  }
  if(act==='copyR'){
    var r2=(c.research||[]).filter(function(x){return x.id===v;})[0];
    copyText(r2?r2.content:''); return;
  }
  if(act==='jdPill'){ var jd=document.getElementById('jd-'+v); if(jd) jd.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(act==='openTracker'){ toast('原型：跳转 #/tracker/'+v+'（只读回链）'); return; }
  if(act==='openLb'){ openLightbox(parseInt(v,10)||0); return; }
}

/* ---------- v2：结构化板块与图表（原生 SVG / CSS，灰阶变量，不写死颜色） ---------- */
function salaryChartHtml(c){
  var rows=c.salaries||[];
  if(!rows.length) return '<div class="readonly">暂无薪资样本，去补充后生成区间图（不画空图）。</div>';
  var max=80, W=700, L=180, R=96, bw=W-L-R, y0=30, rh=46, H=y0+rows.length*rh+34;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="按岗位族的薪资区间图">';
  [0,20,40,60,80].forEach(function(k){
    var x=L+k/max*bw;
    s+='<line class="axis" x1="'+x+'" y1="'+(y0-10)+'" x2="'+x+'" y2="'+(y0+rows.length*rh-12)+'" stroke-width="1"/>';
    s+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="11">'+k+'K</text>';
  });
  rows.forEach(function(r,i){
    var y=y0+i*rh, x1=L+r.low/max*bw, x2=L+r.high/max*bw, xa=L+r.avg/max*bw;
    s+='<text class="lbl" x="4" y="'+(y+6)+'" font-size="12.5">'+esc(r.role)+'</text>';
    s+='<text x="4" y="'+(y+21)+'" font-size="10.5">'+esc(r.level)+' · '+r.sampleSize+' 份 · '+esc(r.source)+'</text>';
    if(r.jd){ var j1=L+r.jd[0]/max*bw, j2=L+r.jd[1]/max*bw;
      s+='<rect class="jd" x="'+j1+'" y="'+(y-17)+'" width="'+(j2-j1)+'" height="7" stroke-dasharray="3 2"/>'; }
    s+='<rect class="range" x="'+x1+'" y="'+(y-5)+'" width="'+(x2-x1)+'" height="11" rx="3"/>';
    s+='<line class="avg" x1="'+xa+'" y1="'+(y-11)+'" x2="'+xa+'" y2="'+(y+11)+'" stroke-width="2"/>';
    s+='<text x="'+(x2+7)+'" y="'+(y+4)+'" font-size="11">'+r.low+'–'+r.high+'K · 均 '+r.avg+'K</text>';
  });
  s+='</svg>';
  return '<div class="chart">'+s+'<div class="notice">口径：¥/月（按薪资月数折算）· 灰条＝员工样本低位–高位，实心竖线＝平均，虚线框＝JD 招聘区间。样本自述，仅供参考。</div></div>';
}
function fundingChartHtml(c){
  var rs=c.fundingRounds||[];
  if(rs.length<2) return '<div class="readonly">暂无连续轮次数据，补充后生成融资图。</div>';
  var cum=0, pts=rs.map(function(r){ cum+=Number(r.amount)||0; return {r:r,cum:cum}; });
  var max=(Math.max.apply(null,pts.map(function(p){return p.cum;}))||1)*1.15;
  var W=700,L=48,R=28,T=26,B=44,bw=W-L-R,ch=150;
  var X=function(i){ return L+(i/(rs.length-1))*bw; }, Y=function(v){ return T+ch-(v/max*ch); };
  var s='<svg viewBox="0 0 '+W+' '+(T+ch+B)+'" role="img" aria-label="连续融资阶梯累计图">';
  s+='<line class="axis" x1="'+L+'" y1="'+(T+ch)+'" x2="'+(W-R)+'" y2="'+(T+ch)+'"/>';
  var d='';
  pts.forEach(function(p,i){ var x=X(i), y=Y(p.cum); d+=(i===0?'M '+L+' '+y:' H '+x+' V '+y); });
  s+='<path class="step" d="'+d+'" stroke-width="2"/>';
  pts.forEach(function(p,i){
    var x=X(i), y=Y(p.cum);
    s+='<circle class="node" cx="'+x+'" cy="'+y+'" r="3.5"/>';

/* 纯内容拼装：Markdown 与 PNG 图片共用同一份配置，避免两套逻辑漂移 */
function buildBriefLines(c,cfg){
  var lines=['# '+c.name+' · 公司简报','',
    '- 行业：'+catName(industryCatOf(c))+' / '+(c.industry||'—'),
    '- 规模：'+(c.scale||'—'),'- 地点：'+(c.location||'—'),'- 官网：'+(c.website||'—'),
    '- 一句话：'+(c.summary||'—'),''];
  if(cfg.verdict&&c.verdict){
    lines.push('## 我的判断','- 推荐度：'+c.verdict.rating,'- 关注点：'+c.verdict.focus,'- 风险红线：'+c.verdict.redline,
      '- 期望 / 底线：'+c.verdict.expect+' / '+c.verdict.bottom);
    (c.verdict.asked||[]).forEach(function(q){lines.push('- 待核实：'+q);}); lines.push('');
  }
  cfg.dims.forEach(function(d){
    lines.push('## '+d);
    var items=(c.research||[]).filter(function(r){return r.dim===d;});
    if(!items.length) lines.push('（暂无资料）');
    items.forEach(function(r){ lines.push('- '+r.content+(r.platform?'　〔来源：'+r.platform+(r.date?' · '+r.date:'')+'〕':'')); });
    if(d==='融资情况'&&cfg.funding) (c.fundingRounds||[]).forEach(function(f){ lines.push('- 轮次：'+f.round+' · '+f.date+' · '+(f.amount?f.amount+' 亿元':'金额未披露')+' · '+f.investors); });
    if(d==='公司简介'&&cfg.strategy) (c.strategyPhases||[]).forEach(function(p){ lines.push('- 阶段：'+p.phase+'（'+p.from+'–'+p.to+'）· '+p.product+' / '+p.revenue+' / '+p.customer); });
    lines.push('');
  });
  if(cfg.jd){
    lines.push('## 岗位 / JD');
    (c.jds||[]).forEach(function(j){ lines.push('- '+j.title+'　'+(j.salary||'')+'　'+(j.city||'')+' · '+(j.experience||'')+' · '+(j.education||'')); if(j.skills&&j.skills.length) lines.push('- 技能：'+j.skills.join(' / ')); });
    if(!(c.jds||[]).length) lines.push('（暂无 JD）'); lines.push('');
  }
  if(cfg.salary){ lines.push('## 薪资水平（按岗位族，¥/月）');
    (c.salaries||[]).forEach(function(s){ lines.push('- '+s.role+'（'+s.level+'）：'+s.low+'–'+s.high+'K · 均 '+s.avg+'K · '+s.sampleSize+' 份 · '+s.source); });
    if(!(c.salaries||[]).length) lines.push('（暂无样本）'); lines.push(''); }
  if(cfg.benefit){ lines.push('## 福利制度');
    (c.benefits||[]).forEach(function(b){ lines.push('- '+b.group+' / '+b.label+'：'+b.status+'（'+b.detail+'）〔'+b.source+' · '+b.verifiedAt+'〕'); });
    if(!(c.benefits||[]).length) lines.push('（暂无资料）'); lines.push(''); }
  if(cfg.interview){ lines.push('## 面试与面经');
    (c.interviews||[]).forEach(function(x){ lines.push('- '+x.round+' · '+x.form+'：'+x.topics+'（'+x.feedback+'）'); });
    if(!(c.interviews||[]).length) lines.push('（暂无记录）'); lines.push(''); }
  if(cfg.links){ lines.push('## 内容链接');
    (c.links||[]).forEach(function(l){ lines.push('- 〔'+l.platform+' · '+l.kind+'〕'+l.title+'（'+l.date+' · '+l.status+'）'); });
    if(!(c.links||[]).length) lines.push('（暂无链接）'); lines.push(''); }
  if(cfg.media){ lines.push('## 图片 / 相册');
    (c.media||[]).forEach(function(m){ lines.push('- '+m.title+'（'+m.kind+' · '+m.source+' · '+m.date+'）'); });
    lines.push(''); }
  if(cfg.rumor){ lines.push('## 风闻 / 待核实（未证实，请勿外传）');
    (c.rumors||[]).forEach(function(u){ lines.push('- '+u.content+'〔'+u.credibility+' · '+u.sentiment+' · '+u.source+' · '+u.date+'〕'); });
    lines.push(''); }
  if(cfg.note){ lines.push('## 备注',c.note||'（无）'); }
  return lines;
}
/* Canvas 2D 直绘演示：强制浅色导出令牌、长图、文字水印、离线可下载 */
function drawBriefImage(c){
  var cfg=readBriefCfg(), lines=buildBriefLines(c,cfg);
  var W=760,pad=40,fs=17,lh=28,tFs=27,hFs=20;
  var m=document.createElement('canvas').getContext('2d');
  function wrap(t,font,maxW){
    m.font=font; var out=[],line='';
    for(var i=0;i<t.length;i++){ var s=line+t[i];
      if(m.measureText(s).width>maxW&&line){ out.push(line); line=t[i]; } else line=s; }
    if(line) out.push(line); return out.length?out:[''];
  }
  var blocks=lines.map(function(l){
    if(l===''||l==='---') return {t:'gap',s:''};
    if(l.indexOf('# ')===0) return {t:'title',s:l.slice(2)};
    if(l.indexOf('## ')===0) return {t:'h2',s:l.slice(3)};
    return {t:'body',s:l};
  });
  var H=pad*2+70;
  blocks.forEach(function(b){
    if(b.t==='gap'){ H+=12; return; }
    var font=b.t==='title'?'500 '+tFs+'px sans-serif':b.t==='h2'?'500 '+hFs+'px sans-serif':fs+'px sans-serif';
    H+=wrap(b.s,font,W-pad*2).length*lh+(b.t==='h2'?16:0);
  });
  var cv=document.getElementById('briefCanvas'); cv.width=W; cv.height=H; cv.style.width='100%';
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);         /* 导出强制浅色，与主题无关 */
  var y=pad;
  blocks.forEach(function(b){
    if(b.t==='gap'){ y+=12; return; }
    var font=b.t==='title'?'500 '+tFs+'px sans-serif':b.t==='h2'?'500 '+hFs+'px sans-serif':fs+'px sans-serif';
    ctx.font=font; ctx.fillStyle=b.t==='title'?'#1a1a1a':b.t==='h2'?'#333333':'#4a4a4a';
    wrap(b.s,font,W-pad*2).forEach(function(line){ ctx.fillText(line,pad,y); y+=lh; });
    if(b.t==='title'){ y+=6; } else if(b.t==='h2'){ ctx.strokeStyle='#e2e2e2'; ctx.beginPath(); ctx.moveTo(pad,y-6); ctx.lineTo(W-pad,y-6); ctx.stroke(); y+=8; }
  });
  y+=20; ctx.font='12px sans-serif'; ctx.fillStyle='#8a8a8a';
  ctx.fillText('生成于 WorkBuddy · 信息以原始来源为准'+(cfg.rumor?' · 含未证实信息，请勿外传':''),pad,Math.min(y,H-20));
  if(cfg.rumor){
    ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(-Math.PI/9);
    ctx.font='500 44px sans-serif'; ctx.fillStyle='rgba(120,120,120,0.14)'; ctx.textAlign='center';
    ctx.fillText('内部参考 · 请勿外传',0,0); ctx.restore();
  }
  document.getElementById('briefImgWrap').hidden=false;
  document.getElementById('briefDl').hidden=false;
  toast('已生成 PNG 预览（浅色底，可离线下载）');
}
function downloadBrief(c){
  var cv=document.getElementById('briefCanvas');
  if(!cv||!cv.width){ toast('请先生成图片预览'); return; }
  cv.toBlob(function(b){
    if(!b){ toast('当前环境不支持导出，可改用打印 PDF'); return; }
    var a=document.createElement('a'),u=URL.createObjectURL(b);
    a.href=u; a.download=(c.name||'公司')+'-公司简报-20261103.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},2000); toast('已下载 PNG');
  },'image/png');
}
function openCompare(){
  var ids=Object.keys(state.checked).filter(function(k){return state.checked[k];});
  if(ids.length<2){ toast('请先在列表里勾选至少 2 家公司'); return; }
  var cs=ids.map(byId).filter(Boolean);
  var rows=[['公司',''],['行业',''],['规模',''],['地点',''],['完整度',''],['调研条目',''],['岗位 JD',''],['一句话摘要','']];
  document.getElementById('modalTitle').textContent='多公司对比 · '+cs.length+' 家';
  document.getElementById('modalBody').innerHTML='<table class="cmp"><thead><tr><th>维度</th>'+cs.map(function(c){return '<th>'+esc(c.name)+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){
      var vals=cs.map(function(c){
        if(r[0]==='公司') return c.name;
        if(r[0]==='行业') return c.industry||'—';
        if(r[0]==='规模') return c.scale||'—';
        if(r[0]==='地点') return c.location||'—';
        if(r[0]==='完整度') return coverage(c)+'/6';
        if(r[0]==='调研条目') return (c.research||[]).length+' 条';
        if(r[0]==='岗位 JD') return (c.jds||[]).length?'<span>'+esc(c.jds[0].title)+' · '+esc(c.jds[0].salary)+'</span>':'—';
        return esc(c.summary||'—');
      });
      return '<tr><th>'+r[0]+'</th>'+vals.map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';
    }).join('')+'</tbody></table>';
  document.getElementById('modalFoot').innerHTML='<button data-act="closeModal">关闭</button>';
  document.getElementById('modal').hidden=false;
}
function closeModal(){ document.getElementById('modal').hidden=true; }

/* ---------- 全局绑定 ---------- */
document.getElementById('viewBtn').addEventListener('click',function(){ state.mode=state.mode==='card'?'table':'card'; if(state.view==='list') renderList(); });
document.getElementById('themeBtn').addEventListener('click',function(){
  var d=document.body.getAttribute('data-theme')==='dark';
  document.body.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('themeBtn').textContent=d?'暗色':'亮色';
});
document.getElementById('newBtn').addEventListener('click',function(){ openDrawer(null); });
document.getElementById('drawer').addEventListener('click',function(e){
  if(e.target.id==='drawer'){ closeDrawer(); return; }
  var t=e.target.closest('[data-act]');
  if(!t) return;
  if(t.getAttribute('data-act')==='closeDrawer'){ closeDrawer(); return; }
  if(t.getAttribute('data-act')==='saveDrawer'){ saveDrawer(); return; }
  if(t.getAttribute('data-act')==='addR'){
    var d=t.getAttribute('data-v');
    var wrap=t.parentNode;
    var el=document.createElement('div'); el.className='ritem'; el.setAttribute('data-rid',uid('r_'));
    el.innerHTML='<div class="rr"><select class="rdim">'+opts(DIMS,d)+'</select><select class="rplat">'+opts(PLATFORMS,'官网')+'</select></div><textarea class="rtext" rows="2" placeholder="收集到的信息"></textarea><input class="rdate" placeholder="日期">';
    wrap.insertBefore(el,t); return;
  }
});
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target.id==='modal'){ closeModal(); return; }
  var t=e.target.closest('[data-act]');
  if(!t) return;
  if(t.getAttribute('data-act')==='closeModal'){ closeModal(); return; }
  if(t.getAttribute('data-act')==='copyBrief'){ copyText(document.getElementById('briefPre').textContent); return; }
  if(t.getAttribute('data-act')==='genBriefImg'){ var c1=byId(state.id); if(c1) drawBriefImage(c1); return; }
  if(t.getAttribute('data-act')==='dlBrief'){ var c2=byId(state.id); if(c2) downloadBrief(c2); return; }
});
document.getElementById('lightbox').addEventListener('click',function(e){
  if(e.target.id==='lightbox'){ document.getElementById('lightbox').hidden=true; return; }
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=t.getAttribute('data-act');
  if(a==='closeLb'){ document.getElementById('lightbox').hidden=true; return; }
  if(a==='lbPrev'){ lbMove(-1); return; }
  if(a==='lbNext'){ lbMove(1); return; }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!document.getElementById('lightbox').hidden){ document.getElementById('lightbox').hidden=true; return; }
    if(!document.getElementById('modal').hidden) closeModal();
    else if(!document.getElementById('drawer').hidden) closeDrawer();
    else if(state.editingRid){ state.editingRid=null; renderDetail(); }
    else if(state.view==='detail') goBack();
    return;
  }
  if(!document.getElementById('lightbox').hidden){
    if(e.key==='ArrowLeft'){ lbMove(-1); return; }
    if(e.key==='ArrowRight'){ lbMove(1); return; }
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){ if(!document.getElementById('drawer').hidden){ e.preventDefault(); saveDrawer(); } return; }
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); if(state.view==='list') document.getElementById('q').focus();
  }
});
renderList();
</script>
</body>
</html>
